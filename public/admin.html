<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bahrem — Administração</title><link rel="stylesheet" href="/styles.css"></head><body><main class="admin">
<div id="login"><img src="/logo.jpg"><h1>Painel do restaurante</h1><input id="user" placeholder="Usuário" autocomplete="username"><input id="pass" type="password" placeholder="Senha" autocomplete="current-password"><button onclick="login()">ENTRAR</button><p id="err"></p></div>
<div id="dash" class="hidden"><header class="admin-head"><img src="/logo.jpg"><div><b>ADMINISTRAÇÃO</b><h1>Controle da fila</h1></div><a href="/">Cliente</a><a href="/display.html">Monitor</a><a href="/qr.html">QR Code</a><button onclick="openAdmins()">🔐 Usuários</button><button onclick="logout()">Sair</button></header>
<section class="stats"><div><small>Na fila</small><strong id="total">0</strong></div><div><small>Preferenciais</small><strong id="pref">0</strong></div><div><small>Chamadas</small><strong id="called">0</strong></div><div><small>Última senha</small><strong id="last">—</strong></div></section><div id="queues" class="queue-grid"></div>
<section class="box"><h2>Chamar próximo</h2><div class="call-grid"><button data-c="23">2–3</button><button data-c="45">4–5</button><button data-c="67">6–7</button><button data-c="10">10+</button></div></section>
<section class="box"><h2>Últimas chamadas</h2><div id="history"></div></section><button class="danger" onclick="resetQ()">LIMPAR FILA</button></div></main>
<div id="adminModal" class="modal hidden"><div class="modal-card wide"><button class="close" onclick="closeAdmins()">×</button><h2>🔐 Usuários autorizados</h2><p>Crie, substitua ou desative as credenciais usadas para chamar clientes.</p>
<div class="new-admin"><h3>Adicionar administrador</h3><div class="form-grid"><input id="newUser" placeholder="Novo usuário" autocomplete="off"><input id="newPass" type="password" placeholder="Senha (mín. 8 caracteres)" autocomplete="new-password"><button onclick="createAdmin()">ADICIONAR</button></div><p id="adminMsg"></p></div>
<div id="adminList"></div></div></div>
<script>
let token=localStorage.bahremToken,state={waiting:[],called:[]};
async function login(){let r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:user.value,password:pass.value})});let x=await r.json();if(!r.ok){err.textContent=x.error;return}token=x.token;localStorage.bahremToken=token;show()}
function show(){if(!token)return;document.querySelector("#login").classList.add("hidden");document.querySelector("#dash").classList.remove("hidden");load()}
function logout(){localStorage.removeItem("bahremToken");location.reload()}
async function load(){let r=await fetch("/api/state");if(r.status===401)return logout();state=await r.json();render()}
function render(){total.textContent=state.waiting.length;pref.textContent=state.waiting.filter(x=>x.priority).length;called.textContent=state.called.length;last.textContent=state.called[0]?.ticket||"—";let names={23:"2–3 pessoas",45:"4–5 pessoas",67:"6–7 pessoas",10:"10+ pessoas"};queues.innerHTML=["23","45","67","10"].map(c=>{let a=state.waiting.filter(x=>x.category===c);return `<section class="queue"><h2>${names[c]} <span>${a.length}</span></h2>${a.map(x=>`<div class="q"><b>${x.ticket}</b><span>${x.people_count} pessoas</span>${x.priority?"<em>PREFERENCIAL</em>":""}</div>`).join("")||"<small>Fila vazia</small>"}</section>`}).join("");history.innerHTML=state.called.slice(0,15).map(x=>`<p><b>${x.ticket}</b> · ${x.people_count} pessoas · ${x.priority?"Preferencial":"Normal"} · ${new Date(x.called_at).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}</p>`).join("")}
document.querySelectorAll("[data-c]").forEach(b=>b.onclick=async()=>{let r=await fetch("/api/call",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({category:b.dataset.c})});let x=await r.json();if(!r.ok)alert(x.error);load()});
async function resetQ(){if(confirm("Limpar a fila?")){await fetch("/api/reset",{method:"POST",headers:{Authorization:"Bearer "+token}});load()}}
function openAdmins(){adminModal.classList.remove("hidden");loadAdmins()}
function closeAdmins(){adminModal.classList.add("hidden")}
async function loadAdmins(){let r=await fetch("/api/admins",{headers:{Authorization:"Bearer "+token}});if(r.status===401)return logout();let rows=await r.json();adminList.innerHTML=rows.map(x=>`<div class="admin-row"><div><b>${x.username}</b><span class="${x.active?"active":"inactive"}">${x.active?"ATIVO":"DESATIVADO"}</span></div><div class="admin-actions"><button onclick="changeAdminPassword(${x.id},'${x.username}')">Trocar senha</button><button onclick="toggleAdmin(${x.id},${!x.active})">${x.active?"Desativar":"Ativar"}</button></div></div>`).join("")}
async function createAdmin(){let u=newUser.value.trim(),p=newPass.value;adminMsg.textContent="";let r=await fetch("/api/admins",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({username:u,password:p})});let x=await r.json();if(!r.ok){adminMsg.textContent=x.error;return}newUser.value="";newPass.value="";adminMsg.textContent="Administrador criado com sucesso.";loadAdmins()}
async function changeAdminPassword(id,name){let p=prompt("Nova senha para "+name+" (mínimo 8 caracteres):");if(p===null)return;if(p.length<8)return alert("A senha precisa ter pelo menos 8 caracteres.");let r=await fetch("/api/admins/"+id,{method:"PATCH",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({password:p})});let x=await r.json();if(!r.ok)alert(x.error);else{alert("Senha alterada com sucesso.");loadAdmins()}}
async function toggleAdmin(id,active){let action=active?"ativar":"desativar";if(!confirm("Deseja "+action+" este administrador?"))return;let r=await fetch("/api/admins/"+id,{method:"PATCH",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({active})});let x=await r.json();if(!r.ok)alert(x.error);loadAdmins()}
const loginDiv=document.querySelector("#login");loginDiv.id="login";show();setInterval(()=>token&&load(),1500);
</script></body></html>
