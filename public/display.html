<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bahrem — Monitor</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020906;color:#f4f8f4;font-family:Arial,Helvetica,sans-serif}
body{position:relative}
#tvScreen{position:relative;width:100vw;height:100vh;overflow:hidden;background:#020906 url('/monitor-bg.png') center center/100% 100% no-repeat}
/* All coordinates below are proportional to the approved 1670x941 artwork. */
.zone{position:absolute;overflow:hidden}
/* Advertisement video area */
#adZone{left:2.27%;top:19.34%;width:54.43%;height:50.48%;border-radius:12px;background:#010302;overflow:hidden}
#adContainer{width:100%;height:100%;position:relative;background:#010302;display:flex;align-items:center;justify-content:center}
#adContainer iframe,#adContainer video{width:100%;height:100%;display:block;border:0;object-fit:cover;background:#010302}
#adContainer video{object-fit:cover}
.ad-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;background:#010302;color:#aeb8b0;text-align:center}
.ad-placeholder strong{font-size:18px;color:#eaf3eb}.ad-placeholder span{font-size:12px}
.ad-play{display:none !important}
/* Main ticket */
#ticketZone{left:59.88%;top:20.82%;width:36.68%;height:22.96%;display:flex;align-items:center;justify-content:center;text-align:center}
#calledTicket{font-size:clamp(78px,7.6vw,145px);line-height:.82;font-weight:950;letter-spacing:4px;color:#e9ffe9;text-shadow:0 0 14px rgba(100,255,117,.58),0 0 34px rgba(52,232,79,.28);margin-top:-2px}
#calledInfo{position:absolute;left:0;right:0;bottom:13px;font-size:clamp(13px,1.05vw,20px);font-weight:900;color:#eef7ef;line-height:1.1;white-space:nowrap}
#calledTime{display:none}
.ticket-pulse{animation:pulse .8s ease 2}
@keyframes pulse{50%{transform:scale(1.025);filter:brightness(1.15)}}
/* History */
#historyZone{left:60.12%;top:48.55%;width:35.45%;height:19.05%;display:grid;grid-template-rows:repeat(3,1fr);gap:5px;padding:1px 10px 1px 12px}
.history-item{min-width:0;border:1px solid rgba(36,144,72,.55);border-radius:10px;background:rgba(2,19,10,.76);display:grid;grid-template-columns:112px 1fr auto;align-items:center;padding:2px 10px;gap:8px}
.history-ticket{font-size:clamp(20px,1.75vw,31px);font-weight:950;color:#6dff79;letter-spacing:1px}
.history-category{font-size:clamp(12px,1vw,18px);font-weight:700;color:#e7eee8;white-space:nowrap}
.history-meta{font-size:clamp(10px,.8vw,14px);color:#c2cbc4;white-space:nowrap;text-align:right}.history-meta strong{color:#71f57c;font-size:1.05em}
.history-empty{height:100%;display:flex;align-items:center;justify-content:center;color:#78847b;font-size:14px}
/* Waiting counters */
#waitingZone{left:3.05%;top:77.90%;width:93.22%;height:13.05%;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:4px 25px 4px 24px;gap:0}
.wait-item{height:100%;display:flex;align-items:center;justify-content:space-between;padding:8px 28px 8px 18px;border-right:2px solid rgba(45,222,91,.85);min-width:0}
.wait-item:last-child{border-right:0}
.wait-copy{min-width:0}.wait-label{font-size:clamp(15px,1.35vw,25px);font-weight:900;white-space:nowrap}.wait-sub{font-size:clamp(10px,.85vw,15px);margin-top:3px;white-space:nowrap}.wait-count{font-size:clamp(34px,3.3vw,58px);line-height:1;font-weight:950;color:#6cf77a}.wait-item.pref .wait-count{color:#baff4d}
/* Header live + tiny sound control */
#liveZone{left:auto;right:3.05%;top:1.25%;height:5%;display:flex;align-items:center;gap:8px;z-index:25}
.live-dot{width:12px;height:12px;border-radius:50%;background:#35f27b;box-shadow:0 0 13px #35f27b;display:inline-block}
.live-text{font-size:clamp(14px,1.1vw,22px);font-weight:900;letter-spacing:1px}
#soundButton{position:absolute;right:3.25%;top:9.15%;width:31px;height:22px;border:1px solid rgba(72,236,100,.85);border-radius:999px;background:rgba(0,12,6,.55);color:#eaffed;font-size:11px;line-height:1;cursor:pointer;z-index:20;padding:0;opacity:.88}
#soundButton.active{color:#7dff8a;border-color:#7dff8a}
@media(max-aspect-ratio:1.55){#calledTicket{font-size:clamp(70px,8vw,120px)}.history-item{grid-template-columns:95px 1fr auto}.wait-item{padding-left:10px;padding-right:15px}.wait-label{font-size:14px}}
@media(max-width:900px){html,body{overflow:auto}#tvScreen{width:100%;height:auto;min-height:100vh;background:#020906}#adZone,#ticketZone,#historyZone,#waitingZone,#liveZone,#soundButton{position:relative;left:auto;right:auto;top:auto;width:auto;height:auto;margin:12px}.zone{position:relative}#adZone{height:46vh}.ticket-zone{height:25vh}#historyZone{height:26vh}#waitingZone{display:grid;grid-template-columns:repeat(2,1fr);height:auto}.wait-item{min-height:90px}}
</style>
</head>
<body>
<div id="tvScreen">
  <section id="adZone" class="zone"><div id="adContainer"><div class="ad-placeholder"><strong>Carregando publicidade...</strong><span>Configure o vídeo no painel administrativo.</span></div></div></section>
  <section id="ticketZone" class="zone"><div id="calledTicket">---</div><div id="calledInfo">Aguardando próxima chamada</div><div id="calledTime"></div></section>
  <section id="historyZone" class="zone"><div class="history-empty">Nenhuma senha chamada ainda.</div></section>
  <section id="waitingZone" class="zone"></section>
  <div id="liveZone"><span class="live-dot"></span><span class="live-text">ATENDIMENTO</span></div>
  <button id="soundButton" type="button" title="Ativar som">🔊</button>
</div>
<script>
(function(){
  let lastCalledId=null,audioReady=false,audioCtx=null,adSignature='';
  const $=id=>document.getElementById(id);
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function videoInfo(raw){
    const value=String(raw||'').trim(); if(!value)return null; let u; try{u=new URL(value)}catch{return null}
    const host=u.hostname.replace(/^www\./,'').toLowerCase(); let id='';
    if(host==='youtu.be') id=u.pathname.split('/').filter(Boolean)[0]||'';
    else if(host.endsWith('youtube.com')) id=u.searchParams.get('v')||((u.pathname.match(/\/(?:shorts|embed|live)\/([^/?]+)/i)||[])[1]||'');
    if(id) return {type:'iframe',src:`https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&mute=1&playsinline=1&loop=1&playlist=${encodeURIComponent(id)}&controls=1&rel=0&modestbranding=1`};
    if(host.endsWith('vimeo.com')){const m=u.pathname.match(/\/video\/(\d+)|\/(\d+)/);if(m)return{type:'iframe',src:`https://player.vimeo.com/video/${m[1]||m[2]}?autoplay=1&muted=1&loop=1&background=1&playsinline=1`}}
    if(/\.(mp4|webm|ogg|m4v)(?:[?#].*)?$/i.test(u.pathname))return{type:'video',src:u.href};
    return {type:'iframe',src:value};
  }
  function adMessage(title,sub){$('adContainer').innerHTML=`<div class="ad-placeholder"><strong>${esc(title)}</strong><span>${esc(sub||'')}</span></div>`}
  function renderAd(raw){
    const c=$('adContainer'),v=videoInfo(raw); if(!v){adMessage('Publicidade não configurada','Configure o vídeo no painel administrativo.');return}
    if(v.type==='video'){
      c.innerHTML=`<video id="adVideo" src="${esc(v.src)}" autoplay muted loop playsinline preload="auto" controls></video>`;
      const el=$('adVideo'); el.addEventListener('error',()=>adMessage('Não foi possível abrir o vídeo','Verifique o link do vídeo.')); el.play().catch(()=>{}); return;
    }
    c.innerHTML=`<iframe id="adFrame" src="${esc(v.src)}" title="Publicidade" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
  }
  async function loadAd(){try{const r=await fetch('/api/config',{cache:'no-store'});if(!r.ok)return;const d=await r.json();const sig=String(d.videoUrl||'');if(sig!==adSignature){adSignature=sig;renderAd(sig)}}catch{}}
  async function unlockAudio(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C){audioReady=true;return}if(!audioCtx)audioCtx=new C();if(audioCtx.state==='suspended')await audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=880;g.gain.value=.00001;o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.02);audioReady=true;$('soundButton').textContent='🔊';$('soundButton').classList.add('active')}catch(e){console.warn(e)}}
  function dingDong(){if(!audioReady||!audioCtx)return;const now=audioCtx.currentTime+.02;function tone(freq,start,dur,vol){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(freq,start);g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(vol,start+.015);g.gain.exponentialRampToValueAtTime(.0001,start+dur);o.connect(g);g.connect(audioCtx.destination);o.start(start);o.stop(start+dur+.03)}tone(1046.5,now,.42,.2);tone(659.3,now+.38,.58,.24)}
  function renderState(state){
    const calls=Array.isArray(state.called)?state.called:[],called=calls[0]||null,waiting=Array.isArray(state.waiting)?state.waiting:[];
    if(called){
      $('calledTicket').textContent=called.ticket||'---';
      $('calledInfo').textContent=called.priority?'⭐ Atendimento preferencial':'Dirija-se ao atendimento';
      const id=called.id||called.ticket;
      if(lastCalledId!==null&&id!==lastCalledId){dingDong();const t=$('calledTicket');t.classList.remove('ticket-pulse');void t.offsetWidth;t.classList.add('ticket-pulse')}
      lastCalledId=id;
    }
    const cats=[['23','2–3'],['45','4–5'],['67','6–7'],['8','8+']];
    $('waitingZone').innerHTML=cats.map(([key,label])=>{const list=waiting.filter(x=>String(x.category)===key);return `<div class="wait-item"><div class="wait-copy"><div class="wait-label">${label} pessoas</div><div class="wait-sub">aguardando</div></div><strong class="wait-count">${list.length}</strong></div>`}).join('')+`<div class="wait-item pref"><div class="wait-copy"><div class="wait-label">⭐ Preferenciais</div><div class="wait-sub">total aguardando</div></div><strong class="wait-count">${waiting.filter(x=>x.priority).length}</strong></div>`;
    const hist=calls.slice(0,3);
    $('historyZone').innerHTML=hist.length?hist.map(x=>{const d=x.called_at,mins=d?Math.max(0,Math.floor((Date.now()-new Date(d).getTime())/60000)):0;const cat={23:'Mesa 2–3',45:'Mesa 4–5',67:'Mesa 6–7',8:'Mesa 8+'}[x.category]||'';return `<div class="history-item"><div class="history-ticket">${esc(x.ticket)}</div><div class="history-category">${esc(cat)}</div><div class="history-meta">✓ &nbsp; <strong>Há ${mins} min</strong></div></div>`}).join(''):'<div class="history-empty">Nenhuma senha chamada ainda.</div>';
  }
  async function loadState(){try{const r=await fetch('/api/state',{cache:'no-store'});if(r.ok)renderState(await r.json())}catch{}}
  $('soundButton').onclick=unlockAudio; window.addEventListener('pointerdown',()=>{if(!audioReady)unlockAudio()},{once:true});
  try{const p=location.protocol==='https:'?'wss:':'ws:';const ws=new WebSocket(p+'//'+location.host);ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='state')renderState(m.state)}catch{}}}catch{}
  loadState();loadAd();setInterval(loadState,1500);setInterval(loadAd,8000);
})();
</script>
</body>
</html>
