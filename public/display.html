<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bahrem — Monitor</title><link rel="stylesheet" href="/styles.css">
<style>
.tv-layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,.8fr);gap:22px;align-items:stretch}
.tv-video{min-height:420px;border:2px solid #26352b;border-radius:22px;overflow:hidden;background:#090b0a;position:relative;display:flex;align-items:center;justify-content:center}
.tv-video iframe,.tv-video video{width:100%;height:100%;min-height:420px;border:0;object-fit:cover}
.tv-video-empty{padding:30px;text-align:center;color:#aaa}
.tv-video-empty strong{display:block;color:#fff;font-size:22px;margin-bottom:8px}
.sound-control{position:fixed;right:20px;bottom:18px;z-index:20;border:0;border-radius:999px;padding:12px 18px;font-weight:800;cursor:pointer}
.sound-control.ready{opacity:.75}
.call-flash{animation:callFlash .8s ease 2}
@keyframes callFlash{50%{transform:scale(1.015);filter:brightness(1.45)}}
@media(max-width:900px){.tv-layout{grid-template-columns:1fr}.tv-video{min-height:300px}.tv-video iframe,.tv-video video{min-height:300px}}

/* ===== TV 24" / FULL HD (1920x1080) ===== */
@media (min-width: 1200px) and (min-height: 700px){
  .tv-screen{
    width:100vw;
    height:100vh;
    min-height:0;
    padding:16px 24px 10px;
    gap:10px;
    overflow:hidden;
  }
  .tv-header{flex:0 0 66px;padding:2px 6px 10px}
  .tv-logo{height:52px;max-width:190px}
  .tv-brand{gap:12px}
  .tv-brand-name{font-size:28px}
  .tv-brand-sub{font-size:11px;letter-spacing:4px}
  .tv-live{font-size:13px}
  .tv-main{flex:0 0 510px;min-height:0;grid-template-columns:minmax(0,1.42fr) minmax(360px,.78fr);gap:14px}
  .tv-call-card{min-height:0;border-radius:18px}
  .tv-section-title{font-size:16px;letter-spacing:1.5px}
  .tv-called-ticket{font-size:clamp(100px,10vw,170px);margin:10px 0 4px}
  .tv-called-info{font-size:19px}
  .tv-called-time{font-size:14px;margin-top:7px}
  .tv-ad-card{padding:10px;border-radius:18px}
  .tv-ad-label{font-size:12px;padding:2px 0 7px}
  .tv-ad-container,.tv-ad-media{min-height:0;height:100%}
  .tv-history{flex:0 0 205px;min-height:0;gap:6px}
  .tv-history-grid{gap:10px;min-height:0;flex:1}
  .tv-history-item{padding:12px 16px;border-radius:16px;min-height:0}
  .tv-history-ticket{font-size:30px}
  .tv-history-meta{font-size:11px;gap:1px 7px}
  .tv-history-meta span:first-child{font-size:21px}
  .tv-history-meta strong{font-size:18px}
  .tv-footer{flex:0 0 32px;min-height:32px;font-size:13px}
  .tv-sound-button{right:0;bottom:-1px;padding:6px 10px;font-size:12px}
}
/* 24" displays with less vertical resolution: never create page scroll */
@media (min-width: 1200px) and (max-height: 850px){
  .tv-screen{padding:10px 18px 6px;gap:7px}
  .tv-header{flex-basis:56px;padding-bottom:7px}
  .tv-logo{height:44px}.tv-brand-name{font-size:24px}
  .tv-main{flex-basis:430px;gap:10px}
  .tv-called-ticket{font-size:clamp(90px,9vw,145px);margin:6px 0 2px}
  .tv-history{flex-basis:175px}
  .tv-history-item{padding:9px 12px}
  .tv-history-ticket{font-size:26px}
  .tv-footer{flex-basis:26px;min-height:26px;font-size:11px}
}

</style>
</head>
<body class="tv">

<div id="tvScreen" class="tv-screen">
  <header class="tv-header">
    <div class="tv-brand">
      <img src="/logo.jpg" alt="Bahrem Burger & Grill" class="tv-logo">
      <div>
        <div class="tv-brand-name">BAHREM</div>
        <div class="tv-brand-sub">BURGER &amp; GRILL</div>
      </div>
    </div>
    <div class="tv-live"><span class="tv-live-dot"></span> ATENDIMENTO</div>
  </header>

  <main class="tv-main">
    <section class="tv-call-card">
      <div class="tv-section-title">ÚLTIMA SENHA CHAMADA</div>
      <div id="calledTicket" class="tv-called-ticket">---</div>
      <div id="calledInfo" class="tv-called-info">Aguardando próxima chamada</div>
      <div id="calledTime" class="tv-called-time"></div>
    </section>

    <aside class="tv-ad-card">
      <div class="tv-ad-label">PUBLICIDADE</div>
      <div id="adContainer" class="tv-ad-container">
        <div class="tv-ad-placeholder">Carregando publicidade...</div>
      </div>
    </aside>
  </main>

  <section class="tv-history">
    <div class="tv-section-title">ÚLTIMAS 3 SENHAS CHAMADAS</div>
    <div id="historyList" class="tv-history-grid"></div>
  </section>

  <footer class="tv-footer">
    <span>🔔</span>
    <span>Acompanhe sua senha no painel. Em breve será a sua vez!</span>
    <button id="soundButton" class="tv-sound-button" type="button">🔊 Ativar som</button>
  </footer>
</div>
<script>
(function(){
  let lastCalledId = null;
  let audioReady = false;
  let adUrl = "";
  let adSignature = "";
  let refreshTimer = null;
  let audioCtx = null;

  const $ = id => document.getElementById(id);

  function escapeHtml(v){
    return String(v ?? "").replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
  }

  function normalizeVideoUrl(url){
    if(!url) return null;
    url = String(url).trim();
    if(!url) return null;

    // YouTube
    let m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
    if(m) return {type:"iframe", src:"https://www.youtube.com/embed/"+m[1]+"?autoplay=1&mute=1&loop=1&playlist="+m[1]+"&controls=0&rel=0"};

    // Vimeo
    m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
    if(m) return {type:"iframe", src:"https://player.vimeo.com/video/"+m[1]+"?autoplay=1&muted=1&loop=1&background=1"};

    // Direct video
    if(/\.(mp4|webm|ogg)(?:\?.*)?$/i.test(url)) return {type:"video", src:url};

    return {type:"iframe", src:url};
  }

  function renderAd(url){
    const c = $("adContainer");
    const v = normalizeVideoUrl(url);
    if(!v){
      c.innerHTML = '<div class="tv-ad-placeholder"><div class="tv-ad-icon">🍔</div><strong>BAHREM BURGER &amp; GRILL</strong><span>Aguarde sua chamada</span></div>';
      return;
    }
    if(v.type === "video"){
      c.innerHTML = '<video class="tv-ad-media" src="'+escapeHtml(v.src)+'" autoplay muted loop playsinline></video>';
    } else {
      c.innerHTML = '<iframe class="tv-ad-media" src="'+escapeHtml(v.src)+'" title="Publicidade" allow="autoplay; fullscreen" frameborder="0"></iframe>';
    }
  }

  async function loadAd(){
    try{
      const r = await fetch("/api/config", {cache:"no-store"});
      if(!r.ok) return;
      const data = await r.json();
      const url = data.videoUrl || "";
      const sig = JSON.stringify(data);
      if(sig !== adSignature){
        adSignature = sig;
        adUrl = url;
        renderAd(url);
      }
    }catch(e){}
  }

  async function unlockAudio(){
    try{
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) { audioReady=true; return; }
      if(!audioCtx) audioCtx = new Ctx();
      if(audioCtx.state === "suspended") await audioCtx.resume();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = "sine";
      o.frequency.value = 880;
      g.gain.value = 0.00001;
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + 0.025);
      audioReady = true;
      $("soundButton").textContent = "🔊 Som ativado";
      $("soundButton").classList.add("active");
    }catch(e){
      console.warn("Áudio não pôde ser ativado", e);
    }
  }

  function dingDong(){
    if(!audioReady || !audioCtx) return;
    try{
      if(audioCtx.state === "suspended") audioCtx.resume();
      const now = audioCtx.currentTime + 0.02;
      function tone(freq, start, duration, volume){
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(volume, start + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(start); osc.stop(start + duration + 0.03);
      }
      tone(1046.5, now, 0.42, 0.20);
      tone(659.3, now + 0.38, 0.58, 0.24);
    }catch(e){ console.warn("Falha ao tocar campainha", e); }
  }

  function flashCall(){
    const card = $("calledTicket").closest(".tv-call-card");
    card.classList.remove("tv-call-pulse");
    void card.offsetWidth;
    card.classList.add("tv-call-pulse");
  }

  function renderState(state){
    const calls = Array.isArray(state.called) ? state.called : [];
    const called = calls[0] || state.lastCalled || null;
    const history = calls.slice(0,3);
    if(called){
      $("calledTicket").textContent = called.ticket || "---";
      $("calledInfo").textContent = called.priority ? "ATENDIMENTO PREFERENCIAL" : "Dirija-se ao atendimento";
      const d = called.called_at || called.calledAt;
      $("calledTime").textContent = d ? "Chamado às " + new Date(d).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}) : "";
      const id = called.id || called.ticket;
      if(lastCalledId !== null && id !== lastCalledId){
        dingDong();
        flashCall();
      }
      lastCalledId = id;
    }

    $("historyList").innerHTML = history.slice(0,3).map((x,i)=>{
      const d = x.called_at || x.calledAt;
      const elapsed = d ? Math.max(0, Math.floor((Date.now()-new Date(d).getTime())/60000)) : 0;
      return '<div class="tv-history-item">'+
        '<div class="tv-history-ticket">'+escapeHtml(x.ticket || "---")+'</div>'+
        '<div class="tv-history-meta"><span>⏱</span><span>Tempo decorrido</span><strong>'+elapsed+' min</strong></div>'+
      '</div>';
    }).join("");
  }

  async function loadState(){
    try{
      const r = await fetch("/api/state", {cache:"no-store"});
      if(!r.ok) return;
      renderState(await r.json());
    }catch(e){}
  }

  $("soundButton").addEventListener("click", unlockAudio);
  window.addEventListener("pointerdown", function(){ if(!audioReady) unlockAudio(); }, {once:true});

  // Sincronização em tempo real: o servidor envia o estado imediatamente após cada chamada.
  try{
    const wsProtocol = location.protocol === "https:" ? "wss:" : "ws:";
    const ws = new WebSocket(wsProtocol + "//" + location.host);
    ws.addEventListener("message", ev => {
      try{
        const msg = JSON.parse(ev.data);
        if(msg && msg.type === "state" && msg.state) renderState(msg.state);
      }catch(e){}
    });
    ws.addEventListener("close", () => {
      // O polling abaixo continua funcionando mesmo se o WebSocket cair.
    });
  }catch(e){}

  loadState();
  loadAd();
  setInterval(loadState, 1500);
  setInterval(loadAd, 10000);
})();
</script>

</body></html>
