<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bahrem — Monitor</title><link rel="stylesheet" href="/styles.css"></head><body class="tv"><main><header><img src="/logo.jpg"></header><section class="last"><span>ÚLTIMA SENHA CHAMADA</span><div>📣 <b id="last">—</b></div><p>Chamado em <strong id="time">—</strong></p></section><section><h2>ÚLTIMAS 3 SENHAS CHAMADAS</h2><div id="recent"></div></section><footer>Agradecemos sua paciência. Em breve, será a sua vez! 🍔</footer></main><script>
let lastSeen=null,audioReady=false;document.body.onclick=()=>audioReady=true;
function beep(){if(!audioReady)return;let C=AudioContext||webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.setValueAtTime(.01,c.currentTime);g.gain.exponentialRampToValueAtTime(.25,c.currentTime+.03);g.gain.exponentialRampToValueAtTime(.01,c.currentTime+.5);o.start();o.stop(c.currentTime+.55)}
async function render(){let s=await fetch("/api/state").then(r=>r.json()),x=s.called[0];if(x?.ticket&&lastSeen&&x.ticket!==lastSeen)beep();lastSeen=x?.ticket||lastSeen;last.textContent=x?.ticket||"—";time.textContent=x?new Date(x.called_at).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}):"—";recent.innerHTML=s.called.slice(0,3).map(x=>{let m=Math.max(0,Math.floor((Date.now()-new Date(x.called_at).getTime())/60000));return `<article><b>${x.ticket}</b><span>${x.priority?"PREFERENCIAL":"Normal"} · ${x.people_count} pessoas</span><strong>${m} min</strong></article>`}).join("")}
render();setInterval(render,1000);
</script></body></html>
